<!DOCTYPE html>
<html lang="pl" data-bs-theme="dark"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planer tygodnia</title>

    <style>
        body {
            font-family: "Inter", sans-serif !important;
        }
        
        * {
            scroll-behavior: smooth;
        }
        
        .small {
            line-height: 1.15rem;
        }
        
        .logo {
            font-family: "DM Sans", sans-serif!important;
            font-weight: 600!important;
            letter-spacing: -0.08em;
            text-decoration: none !important;
            color: #fff !important;
        
        }
        
        .width-1 {
            width: 3rem !important;
            height: 3rem !important;
            min-width: 3rem!important;
            min-height: 3rem!important;
        }
        
        .bg-fading {
            background: linear-gradient(
                to top,
                #000 0%,
                #000 30%,
                transparent 100%
            );
        }

        .task-editor {
            resize: none;
            overflow: hidden;
            box-shadow: none !important;
        }

    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
</head>

<body class="bg-black text-white">

    <!-- HEADER -->
    <div class="bg-black sticky-top icon-link gap-2 w-100 p-3 z-2" style="padding-right: 16px; margin-right: 0px;">
        <img class="img-fluid object-fit-cover rounded-circle width-1 p-1 bg-white" src="https://plain-weur-prod-public.komododecks.com/202605/25/jAsrISNJ3wOWP5EcWXG5/image.png">
        <span class="fs-5 lh-1 logo">
            Wieczorek
            <br>
            Investments
        </span>

        <div class="icon-link ms-auto">
            <!-- RESET -->
            <button class="btn p-0" id="resetBtn" type="button" title="Usuń wszystkie zadania" aria-label="Usuń wszystkie zadania">
                <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#fff"><path d="M440-122q-121-15-200.5-105.5T160-440q0-66 26-126.5T260-672l57 57q-38 34-57.5 79T240-440q0 88 56 155.5T440-202v80Zm80 0v-80q87-16 143.5-83T720-440q0-100-70-170t-170-70h-3l44 44-56 56-140-140 140-140 56 56-44 44h3q134 0 227 93t93 227q0 121-79.5 211.5T520-122Z"/></svg>
            </button>

            <!-- IMPORT -->
            <label class="btn p-0 m-0" title="Importuj zadania z pliku JSON" aria-label="Importuj zadania z pliku JSON">
                <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#fff">
                    <path d="M467-120q-73-1-136-14t-110-34.5q-47-21.5-74-50T120-280q0 33 27 61.5t74 50Q268-147 331-134t136 14Zm-15-200q-38-2-73.5-6.5t-67.5-12q-32-7.5-60-17.5t-51-23q23 13 51 23t60 17.5q32 7.5 67.5 12T452-320Zm28-279q89 0 179-26.5T760-679q-11-29-100.5-55T480-760q-91 0-178.5 25.5T200-679q14 27 101.5 53.5T480-599Zm220 479h40v-164l72 72 28-28-120-120-120 120 28 28 72-72v164ZM578.5-98.5Q520-157 520-240t58.5-141.5Q637-440 720-440t141.5 58.5Q920-323 920-240T861.5-98.5Q803-40 720-40T578.5-98.5ZM443-201q3 22 9 42t15 39q-73-1-136-14t-110-34.5q-47-21.5-74-50T120-280v-400q0-66 105.5-113T480-840q149 0 254.5 47T840-680v187q-19-9-39-15t-41-9v-62q-52 29-124 44t-156 15q-85 0-157-15t-123-44v101q51 47 130.5 62.5T480-400h11q-13 18-22.5 38T452-320q-76-4-141-18.5T200-379v99q7 13 30 26.5t56 24q33 10.5 73.5 18T443-201Z"></path>
                </svg>
                <input type="file" id="importFile" class="d-none" accept=".json">
            </label>

            <!-- EXPORT -->
            <button class="btn btn-sm btn-light fw-semibold px-3 rounded-pill ms-1" id="exportBtn">
                Pobierz
            </button>
        </div>
    </div>

    <div class="pt-4 pb-5 px-3 border-top border-5 rounded-top-5 border-dark position-relative z-3 bg-black" id="tasks">
    </div>

    <script>
    (() => {
        const days = [
            ['poniedzialek', 'Poniedziałek'],
            ['wtorek', 'Wtorek'],
            ['sroda', 'Środa'],
            ['czwartek', 'Czwartek'],
            ['piatek', 'Piątek'],
            ['sobota', 'Sobota'],
            ['niedziela', 'Niedziela']
        ];
        const storageKey = 'plannerTasks';
        const planner = document.querySelector('#tasks');
        let tasks = Object.fromEntries(days.map(([key]) => [key, []]));

        try {
            const saved = JSON.parse(localStorage.getItem(storageKey));
            if (saved && typeof saved === 'object') {
                days.forEach(([key]) => {
                    if (Array.isArray(saved[key])) {
                        tasks[key] = saved[key]
                            .filter(task => task && typeof task.text === 'string')
                            .map(task => ({
                                id: String(task.id || `${Date.now()}-${Math.random()}`),
                                text: task.text,
                                completed: Boolean(task.completed)
                            }));
                    }
                });
            }
        } catch {
            localStorage.removeItem(storageKey);
        }

        function saveTasks() {
            const savedTasks = Object.fromEntries(days.map(([key]) => [
                key,
                tasks[key].filter(task => task.text.trim())
            ]));
            localStorage.setItem(storageKey, JSON.stringify(savedTasks));
        }

        function render(focusTaskId = null) {
            planner.replaceChildren();
            days.forEach(([key, label]) => {
                const section = document.createElement('section');
                section.className = 'border-bottom mb-4';

                const heading = document.createElement('div');
                heading.className = 'd-flex align-items-center justify-content-between w-100 mb-2';
                const title = document.createElement('h2');
                title.className = 'fs-2 fw-bold mb-0';
                title.textContent = label;

                const addButton = document.createElement('button');
                addButton.type = 'button';
                addButton.className = 'btn btn-sm btn-dark fw-semibold px-3 rounded-pill';
                addButton.textContent = 'Dodaj';
                addButton.setAttribute('aria-label', `Dodaj zadanie: ${label}`);
                addButton.addEventListener('click', () => {
                    const task = { id: `${Date.now()}-${Math.random()}`, text: '', completed: false };
                    tasks[key].push(task);
                    render(task.id);
                });
                heading.append(title, addButton);

                const content = document.createElement('div');
                content.className = 'd-flex flex-column gap-2 p-2';
                tasks[key].forEach(task => {
                    const row = document.createElement('div');
                    row.className = 'd-flex align-items-start gap-2';
                    const checkbox = document.createElement('input');
                    checkbox.className = 'form-check-input rounded-circle flex-shrink-0 mt-2 m-0';
                    checkbox.type = 'checkbox';
                    checkbox.checked = task.completed;
                    checkbox.setAttribute('aria-label', `Oznacz jako wykonane: ${task.text}`);
                    checkbox.addEventListener('change', () => {
                        task.completed = checkbox.checked;
                        saveTasks();
                        editor.classList.toggle('text-decoration-line-through', task.completed);
                        editor.classList.toggle('text-secondary', task.completed);
                    });

                    const editor = document.createElement('textarea');
                    editor.maxLength = 2000;
                    editor.className = `task-editor form-control flex-grow-1 bg-transparent text-white border-0 rounded-0 p-1${task.completed ? ' text-decoration-line-through text-secondary' : ''}`;
                    editor.value = task.text;
                    editor.placeholder = 'Treść zadania';
                    editor.setAttribute('aria-label', `Edytuj zadanie: ${task.text || 'nowe zadanie'}`);
                    const resizeEditor = () => {
                        editor.style.height = 'auto';
                        editor.style.height = `${editor.scrollHeight}px`;
                    };
                    editor.addEventListener('input', () => {
                        task.text = editor.value;
                        editor.setAttribute('aria-label', `Edytuj zadanie: ${task.text || 'nowe zadanie'}`);
                        resizeEditor();
                        saveTasks();
                    });
                    editor.addEventListener('blur', () => {
                        if (!task.text.trim()) {
                            tasks[key] = tasks[key].filter(item => item.id !== task.id);
                            render();
                        }
                    });
                    resizeEditor();

                    const remove = document.createElement('button');
                    remove.type = 'button';
                    remove.className = 'btn btn-sm text-warning fw-medium py-0 mt-1';
                    remove.textContent = 'usuń';
                    remove.setAttribute('aria-label', `Usuń zadanie: ${task.text}`);
                    remove.addEventListener('click', () => {
                        tasks[key] = tasks[key].filter(item => item.id !== task.id);
                        saveTasks();
                        render();
                    });
                    row.append(checkbox, editor, remove);
                    content.append(row);
                    if (task.id === focusTaskId) {
                        requestAnimationFrame(() => {
                            editor.focus();
                            editor.setSelectionRange(editor.value.length, editor.value.length);
                        });
                    }
                });

                section.append(heading, content);
                planner.append(section);
            });
        }

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (!window.confirm('Usunąć wszystkie zadania ze wszystkich dni?')) return;
            tasks = Object.fromEntries(days.map(([key]) => [key, []]));
            saveTasks();
            render();
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            const data = { schemaVersion: 1, exportedAt: new Date().toISOString(), days: tasks };
            const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
            const link = document.createElement('a');
            link.href = url;
            link.download = 'planer-zadan.json';
            link.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('importFile').addEventListener('change', async event => {
            const file = event.target.files[0];
            if (!file) return;
            try {
                const imported = JSON.parse(await file.text());
                const importedDays = imported?.days;
                if (!importedDays || typeof importedDays !== 'object') throw new Error('Nieprawidłowy plik');
                const replacement = Object.fromEntries(days.map(([key]) => [key, []]));
                days.forEach(([key]) => {
                    if (!Array.isArray(importedDays[key])) return;
                    replacement[key] = importedDays[key].map(task => {
                        if (!task || typeof task.text !== 'string') throw new Error('Nieprawidłowe zadanie');
                        return { id: `${Date.now()}-${Math.random()}`, text: task.text, completed: Boolean(task.completed) };
                    });
                });
                tasks = replacement;
                saveTasks();
                render();
            } catch {
                window.alert('Nie udało się zaimportować pliku. Wybierz poprawny plik JSON wyeksportowany z planera.');
            } finally {
                event.target.value = '';
            }
        });

        document.getElementById('offcanvasBottom')?.remove();
        render();
    })();
    </script>
    </body>
</html>
